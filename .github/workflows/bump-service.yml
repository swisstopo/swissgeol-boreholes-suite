name: Bump service version

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Service to bump"
        required: true
        type: choice
        options:
          - ocr
          - dataextraction
      version:
        description: "Image tag (e.g. 1.1.3 for ocr, v1.0.162 for dataextraction)"
        required: true
        type: string

permissions: {}

concurrency:
  group: bump-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    name: Update service version and open PR
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate input and resolve component
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

          # Everything that differs between services lives here; the rest of the job is shared
          case "$COMPONENT" in
            ocr)
              echo "LABEL=OCR" >> "$GITHUB_ENV"
              echo "IMAGE=swissgeol-ocr-api" >> "$GITHUB_ENV"
              echo "UPSTREAM=swisstopo/swissgeol-ocr" >> "$GITHUB_ENV"
              ;;
            dataextraction)
              echo "LABEL=Dataextraction" >> "$GITHUB_ENV"
              echo "IMAGE=swissgeol-boreholes-dataextraction-api" >> "$GITHUB_ENV"
              echo "UPSTREAM=swisstopo/swissgeol-boreholes-dataextraction" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown component: $COMPONENT"
              exit 1
              ;;
          esac

      - name: Check current version
        id: check
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          CURRENT=$(awk -v block="^${COMPONENT}:" '
            $0 ~ block { in_block=1; next }
            /^[^ ]/ { in_block=0 }
            in_block && /^  version:/ { gsub(/"/, "", $2); print $2; exit }
          ' charts/swissgeol-boreholes/values.yaml)
          echo "Current: $CURRENT, requested: $VERSION"
          if [[ "$CURRENT" == "$VERSION" ]]; then
            echo "Already at $VERSION, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.email "office@geowerkstatt.ch"
          git config user.name "GeoWerkstatt-Build"

      - name: Update files
        if: steps.check.outputs.skip != 'true'
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          # charts/swissgeol-boreholes/values.yaml: <component>.version
          sed -i "/^${COMPONENT}:/,/^[^ ]/ s|^  version: .*|  version: ${VERSION}|" charts/swissgeol-boreholes/values.yaml

          # charts/swissgeol-boreholes/Chart.yaml: patch bump, otherwise ct lint fails and chart-releaser skips the release
          CHART_FILE=charts/swissgeol-boreholes/Chart.yaml
          CURRENT_CHART=$(grep '^version:' "$CHART_FILE" | awk '{print $2}')
          IFS='.' read -r major minor patch <<< "$CURRENT_CHART"
          sed -i "s|^version: .*|version: ${major}.${minor}.$((patch + 1))|" "$CHART_FILE"

          # docker-compose.yml: image tag
          sed -i "s|${IMAGE}:.*|${IMAGE}:${VERSION}|" docker-compose.yml

          # CHANGELOG.md: insert under ### Changed inside [Unreleased], synthesizing the heading if absent
          awk -v entry="- ${LABEL} service was updated to ${VERSION}." '
            /^## \[Unreleased\]$/ { print; state="unreleased"; next }
            /^## / && state=="unreleased" {
              if (!inserted) { print "### Changed"; print entry; print "" }
              state="other"
            }
            state=="unreleased" && /^### Changed$/ && !inserted {
              print; print entry; inserted=1; next
            }
            { print }
            END {
              if (state=="unreleased" && !inserted) { print "### Changed"; print entry }
            }
          ' CHANGELOG.md > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md

      - name: Commit, push and open PR
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="bump-${COMPONENT}-${VERSION}"
          git checkout -b "$BRANCH"
          git commit -am "Bump ${LABEL} to ${VERSION}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --title "Bump ${LABEL} to ${VERSION}" \
            --body "- Bump ${LABEL} image to ${VERSION} so the chart, docker-compose, and CI track the same version.
          - Upstream release: https://github.com/${UPSTREAM}/releases/tag/${VERSION}"